# Isolated preview only. Deploy with: npx wrangler deploy -c wrangler.dev.toml
# This file must not use the production Worker name or production D1.
name = "efhsband-dev"
main = "worker/src/worker.mjs"
compatibility_date = "2026-07-29"
account_id = "d4e69b2379a7e3c86020154cf70a1d07"
workers_dev = true

[assets]
directory = "./worker/public"
binding = "ASSETS"
run_worker_first = [
  "/",
  "/*.html",
  "/admin",
  "/admin/*",
  "/api/*",
  "/uploads/*",
  "/health",
  "/subscribe",
  "/subscribe/",
  "/caldev",
  "/caldev/",
  "/calendar",
  "/calendar/",
  "/sponsor",
  "/sponsor/",
  "/in-kind",
  "/in-kind/",
  "/letterman-jacket",
  "/letterman-jacket/",
  "/donate",
  "/donate/",
  "/assets/downloads/*",
  "/__dev/*",
]
html_handling = "none"

[vars]
EFBAND_ADMIN_USERNAME = "admin@efhsband.org"
CONTACT_FROM_EMAIL = "no-reply@efhsband.org"
CONTACT_FROM_NAME = "East Forsyth Band Boosters"
CONTACT_DEFAULT_EMAIL = ""
CONTACT_EMAIL_PROVIDER = "none"
DEV_UPLOAD_ORIGIN = "https://efhsband.org"
DEV_ERROR_HOOK = "1"

[[d1_databases]]
binding = "DB"
database_name = "efhsband-dev-db"
database_id = "e71387af-9198-48e6-b6e9-72729866bdae"

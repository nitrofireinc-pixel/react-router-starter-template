[project]
name = "east-forsyth-band-site"
version = "0.1.0"
description = "East Forsyth Band website with editable admin backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

# Cloudflare Pages auto-runs `pip install .` when pyproject.toml is present.
# Pin discovery so setuptools does not treat worker/assets/node_modules as packages.
[tool.setuptools.packages.find]
include = ["backend*"]

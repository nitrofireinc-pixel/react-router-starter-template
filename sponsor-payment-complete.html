<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sponsorship payment | East Forsyth Band</title>
  <link rel="icon" href="/assets/efhs-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .sponsor-complete-shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:linear-gradient(180deg,#f4f7fb,#e8eef6);
    }
    .sponsor-complete-card{
      width:min(440px,100%);
      padding:28px 24px;
      border-radius:18px;
      background:#fff;
      border:1px solid #dbe4ef;
      box-shadow:0 16px 40px rgba(0,33,66,.12);
      text-align:center;
    }
    .sponsor-complete-card h1{
      margin:0 0 10px;
      color:var(--navy,#002142);
      font-size:1.45rem;
    }
    .sponsor-complete-card p{margin:0;color:#5b6b7c;line-height:1.45}
    .sponsor-complete-card .status{margin-top:14px;font-weight:800}
  </style>
</head>
<body>
  <main class="sponsor-complete-shell">
    <div class="sponsor-complete-card">
      <h1>Activating your sponsorship…</h1>
      <p>Please wait a moment while we add your business to the sponsor list.</p>
      <p class="status" id="status">Confirming payment…</p>
    </div>
  </main>
  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const appId = String(params.get('app') || '').trim();
  const token = String(params.get('token') || '').trim();
  const mock = params.get('mock') === '1';
  const status = document.getElementById('status');
  const inFrame = window.parent && window.parent !== window;

  function notify(payload) {
    if (inFrame) {
      window.parent.postMessage(Object.assign({ type: 'efhs-sponsor-paid' }, payload), '*');
      return;
    }
    if (payload.ok) {
      window.location.replace('/become-a-sponsor.html?sponsored=1');
      return;
    }
    if (status) status.textContent = payload.detail || 'Could not activate sponsorship.';
  }

  if (!appId || !token) {
    notify({ ok: false, detail: 'Missing payment confirmation details.' });
    return;
  }

  fetch('/api/sponsor-applications/' + encodeURIComponent(appId) + '/complete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, mock: mock }),
  })
    .then(function (response) {
      return response.json().then(function (data) {
        return { ok: response.ok, data: data || {} };
      });
    })
    .then(function (result) {
      if (!result.ok) {
        notify({ ok: false, detail: result.data.detail || 'Could not activate sponsorship.' });
        return;
      }
      if (status) status.textContent = result.data.detail || 'Sponsorship activated.';
      notify({
        ok: true,
        application_id: appId,
        sponsor: result.data.sponsor || null,
        detail: result.data.detail || 'Sponsorship activated.',
        mock: Boolean(result.data.mock),
      });
    })
    .catch(function () {
      notify({ ok: false, detail: 'Could not activate sponsorship.' });
    });
})();
  </script>
</body>
</html>
